<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derby Dash - Pferderennen (Vanilla)</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Main Application Container -->
    <div id="app-root" class="flex flex-col min-h-screen"></div>

    <script>
        // --- State Management ---
        const horseNames = ['Blitz', 'Tornado', 'Phantom', 'Sturmwind', 'Meteorit'];
        let horses = [];
        let players = [];
        let raceState = 'betting'; // 'betting' | 'racing' | 'finished'
        let winnerId = null;
        let animationFrameId = null;

        function initHorses() {
            horses = horseNames.map((name, i) => ({
                id: 'horse-' + i,
                name: name,
                position: 0,
                baseSpeed: Math.random() * 0.12 + 0.08
            }));
        }

        // Helper string escape function to prevent injection
        function escapeHtml(unsafe) {
            return String(unsafe)
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // --- View Logic ---
        function renderApp() {
            const headerHtml = `
              <header class="h-16 bg-slate-800/80 border-b border-slate-700 flex items-center justify-between px-8 shrink-0 shadow-lg">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-emerald-500 rounded flex items-center justify-center font-black text-slate-900 text-xl">D</div>
                  <h1 class="text-2xl font-bold tracking-tighter uppercase">Derby <span class="text-emerald-400">Dash</span></h1>
                </div>
                
                ${raceState === 'betting' ? `
                  <div class="flex gap-8 text-xs font-bold tracking-widest uppercase text-slate-400 hidden sm:flex">
                    <div class="flex flex-col items-end">
                      <span class="text-emerald-500">Status</span>
                      <span>Wetten geöffnet</span>
                    </div>
                    <div class="flex flex-col items-end">
                      <span>Rennen #Vanilla</span>
                      <span class="text-white">Kein Build-Prozess</span>
                    </div>
                  </div>
                ` : `
                  <button onclick="resetRace()" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg font-medium transition-colors cursor-pointer text-xs uppercase tracking-widest">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    Neues Rennen
                  </button>
                `}
              </header>
            `;

            let mainHtml = '';

            if (raceState === 'betting') {
                const totalPot = players.reduce((sum, p) => sum + p.bet, 0);
                const getHorsePool = (horseId) => players.filter(p => p.horseId === horseId).reduce((sum, p) => sum + p.bet, 0);

                const horseOptions = horses.map(h => `<option value="${h.id}">${h.name}</option>`).join('');
                
                const playersList = players.length === 0 
                    ? `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500 italic">Noch keine Spieler eingetragen.</td></tr>`
                    : players.map(p => {
                        const h = horses.find(ho => ho.id === p.horseId);
                        const horsePool = getHorsePool(p.horseId);
                        const expectedPayout = horsePool > 0 ? (p.bet / horsePool) * totalPot : 0;
                        return `
                        <tr class="hover:bg-slate-700/20">
                          <td class="px-6 py-4 font-medium text-slate-200">${escapeHtml(p.name)}</td>
                          <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-slate-900 border border-slate-700 text-slate-300 rounded text-xs flex items-center w-max gap-1">
                              🐎 ${h.name}
                            </span>
                          </td>
                          <td class="px-6 py-4 font-mono text-slate-400">${p.bet.toFixed(2)} €</td>
                          <td class="px-6 py-4 text-right font-mono text-emerald-400">${expectedPayout.toFixed(2)} €</td>
                        </tr>`;
                    }).join('');
                
                const pot = totalPot.toFixed(2);

                mainHtml = `
                  <div class="flex flex-col lg:flex-row gap-6 animate-fade-in w-full max-w-6xl mx-auto p-4 md:p-6">
                    <section class="w-full lg:w-1/3 flex flex-col gap-6 order-2 lg:order-1">
                      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
                        <h2 class="text-sm font-black uppercase tracking-widest text-emerald-400 mb-6 flex items-center gap-2">
                          <span class="w-2 h-4 bg-emerald-500"></span> Neue Wette
                        </h2>
                        <form id="bet-form" class="space-y-4">
                          <div class="space-y-1.5">
                            <label class="text-[10px] uppercase font-bold text-slate-500 tracking-wide">Spieler Name</label>
                            <input id="player-name" type="text" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500/50 text-white placeholder-slate-600" placeholder="z. B. Max Mustermann">
                          </div>
                          <div class="space-y-1.5">
                            <label class="text-[10px] uppercase font-bold text-slate-500 tracking-wide">Favorit Wählen</label>
                            <select id="horse-select" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-sm outline-none appearance-none text-white focus:ring-2 focus:ring-emerald-500/50">
                              <option value="" disabled selected class="text-slate-500">Bitte wählen...</option>
                              ${horseOptions}
                            </select>
                          </div>
                          <div class="space-y-1.5">
                            <label class="text-[10px] uppercase font-bold text-slate-500 tracking-wide">Einsatz (€)</label>
                            <input id="player-bet" type="number" min="1" step="0.01" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500/50 text-white placeholder-slate-600" placeholder="0.00">
                          </div>
                          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-lg shadow-lg shadow-emerald-900/40 transition-all uppercase tracking-widest text-xs cursor-pointer">
                            Wette Platzieren
                          </button>
                        </form>
                      </div>
                    </section>
                    
                    <section class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl flex flex-col order-1 lg:order-2">
                      <h2 class="text-sm font-black uppercase tracking-widest text-emerald-400 mb-6 flex items-center justify-between">
                        <span>Aktuelle Platzierungen</span>
                        <span class="text-xs text-slate-500 normal-case font-medium">${players.length} Spieler registriert</span>
                      </h2>
                      <div class="flex-1 overflow-hidden border border-slate-700 rounded-lg bg-slate-900/40">
                        <table class="w-full text-left border-collapse text-sm">
                          <thead class="bg-slate-700/30 text-slate-400 uppercase text-[10px] tracking-widest">
                            <tr class="border-b border-slate-700">
                              <th class="px-6 py-4 font-bold">Spieler</th>
                              <th class="px-6 py-4 font-bold">Pferd</th>
                              <th class="px-6 py-4 font-bold">Einsatz</th>
                              <th class="px-6 py-4 font-bold text-right">Mögl. Gewinn</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-700/50">
                            ${playersList}
                          </tbody>
                        </table>
                      </div>
                      <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex gap-4 text-xs font-bold w-full sm:w-auto overflow-x-auto pb-2 sm:pb-0">
                          <div class="bg-slate-900 border border-slate-700 px-4 py-2 rounded shrink-0">
                            POT: <span class="text-emerald-400 ml-1">${pot} €</span>
                          </div>
                        </div>
                        <button id="start-race-btn" ${players.length === 0 ? 'disabled' : ''} class="w-full sm:w-auto px-10 py-4 bg-white text-slate-950 font-black rounded-lg hover:scale-105 active:scale-95 transition-all uppercase tracking-widest text-xs cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                          Rennen Starten 🏁
                        </button>
                      </div>
                    </section>
                  </div>
                `;

            } else if (raceState === 'racing') {
                const horseTracks = horses.map((h, i) => `
                  <div class="relative w-full h-14 md:h-16 flex items-center bg-black/10 rounded my-1">
                    <div class="absolute left-2 text-white/40 text-[10px] font-black uppercase text-slate-300 z-0 tracking-widest flex items-center gap-2">
                      <span class="opacity-40">#${i + 1}</span> <span>${h.name}</span>
                    </div>
                    <div id="horse-anim-${h.id}" class="absolute z-10 drop-shadow-md text-3xl md:text-5xl" style="left: ${5 + h.position}%; transform: translateX(-50%);">🐎</div>
                  </div>
                `).join('');

                mainHtml = `
                  <div class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col animate-fade-in">
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 md:p-8 text-center mb-6 shadow-xl">
                      <h2 class="text-2xl font-black uppercase text-emerald-400 tracking-widest animate-pulse">Das Rennen läuft!</h2>
                      <p class="text-slate-400 mt-2 text-sm">Die Pferde sind auf der Strecke...</p>
                    </div>
                    
                    <div class="w-full bg-[#1a2e18] rounded-xl p-4 md:p-6 shadow-inner border-t border-slate-800 min-h-[400px] relative flex flex-col justify-between overflow-hidden">
                      <div class="absolute inset-0 pointer-events-none">
                        <div class="h-full w-full flex flex-col justify-between py-2 opacity-20">
                          <div class="h-[1px] bg-white w-full"></div>
                          <div class="h-[1px] bg-white w-full"></div>
                          <div class="h-[1px] bg-white w-full"></div>
                          <div class="h-[1px] bg-white w-full"></div>
                          <div class="h-[1px] bg-white w-full"></div>
                          <div class="h-[1px] bg-white w-full"></div>
                        </div>
                        <div class="absolute left-[10%] sm:left-32 top-0 bottom-0 w-1 bg-white/40"></div>
                        <div class="absolute right-[8%] sm:right-12 top-0 bottom-0 w-8 flex flex-col justify-between items-center bg-white/10 hidden sm:flex">
                           <div class="w-full h-full opacity-40 bg-zinc-950" style="background-image: repeating-conic-gradient(#ffffff 0 90deg, #000000 0 180deg); background-size: 16px 16px;"></div>
                        </div>
                      </div>
                      <div class="absolute top-0 bottom-0 left-[5%] w-1 bg-white/70 z-0 shadow-[0_0_10px_rgba(255,255,255,0.5)]"></div>
                      <div class="absolute top-0 bottom-0 left-[85%] sm:left-[90%] w-2 sm:w-3 border-r-2 sm:border-r-4 border-l-2 sm:border-l-4 border-dashed border-white/90 z-0 bg-red-500/30"></div>
                      ${horseTracks}
                    </div>
                  </div>
                `;

            } else if (raceState === 'finished') {
                const winningHorse = horses.find(h => h.id === winnerId);
                const totalPot = players.reduce((sum, p) => sum + p.bet, 0);
                const winningPlayers = players.filter(p => p.horseId === winnerId);
                const winningPool = winningPlayers.reduce((sum, p) => sum + p.bet, 0);
                
                const resultsList = players.length === 0
                    ? `<p class="text-slate-500 italic text-center p-8">Niemand hat gewettet. Besser beim nächsten Mal!</p>`
                    : `
                      <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                          <thead class="bg-slate-700/30 text-slate-400 uppercase text-[10px] tracking-widest">
                            <tr class="border-b border-slate-700">
                              <th class="px-6 py-4 font-bold">Spieler</th>
                              <th class="px-6 py-4 font-bold">Tipp</th>
                              <th class="px-6 py-4 font-bold">Einsatz</th>
                              <th class="px-6 py-4 font-bold text-right">Resultat</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-700/50">
                            ${players.map(p => {
                                const h = horses.find(ho => ho.id === p.horseId);
                                const didWin = h.id === winnerId;
                                const payout = didWin && winningPool > 0 ? (p.bet / winningPool) * totalPot : 0;
                                return `
                                  <tr class="hover:bg-slate-700/20">
                                    <td class="px-6 py-4 font-medium text-slate-200">${escapeHtml(p.name)}</td>
                                    <td class="px-6 py-4">
                                      <span class="px-2 py-1 bg-slate-900 border border-slate-700 text-slate-300 rounded text-xs flex items-center w-max gap-1">
                                        🐎 ${h.name}
                                      </span>
                                    </td>
                                    <td class="px-6 py-4 font-mono text-slate-400">${p.bet.toFixed(2)} €</td>
                                    <td class="px-6 py-4 text-right">
                                      ${didWin 
                                        ? `<div class="inline-flex items-center gap-2 text-emerald-400 font-bold font-mono bg-emerald-500/10 px-3 py-1.5 rounded border border-emerald-500/20">
                                             <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                                             +${payout.toFixed(2)} €
                                           </div>`
                                        : `<div class="inline-flex items-center text-slate-500 text-xs font-mono bg-slate-900 border border-slate-700 px-3 py-1.5 rounded">
                                             - ${p.bet.toFixed(2)} €
                                           </div>`
                                      }
                                    </td>
                                  </tr>
                                `;
                            }).join('')}
                          </tbody>
                        </table>
                      </div>
                    `;

                mainHtml = `
                  <div class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-8 animate-fade-in">
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 md:p-12 text-center shadow-xl relative overflow-hidden">
                      <div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(ellipse at center, rgba(16,185,129,0.1) 0%, rgba(30,41,59,0) 70%);"></div>
                      
                      <div class="relative z-10 flex flex-col items-center">
                        <span class="text-6xl mb-4 drop-shadow-lg">🐎</span>
                        <span class="uppercase tracking-widest font-bold text-emerald-400 text-xs mb-2">Offizieller Gewinner</span>
                        <h2 class="text-5xl md:text-7xl font-black drop-shadow-md text-white uppercase tracking-tighter">
                          ${winningHorse.name}
                        </h2>
                      </div>
                    </div>
                    
                    <div class="bg-slate-800 rounded-xl shadow-xl border border-slate-700 overflow-hidden">
                      <div class="px-6 py-5 border-b border-slate-700 bg-slate-900/40">
                        <h3 class="text-sm font-black uppercase tracking-widest text-emerald-400">Rennergebnis & Ausschüttung</h3>
                      </div>
                      <div class="p-0">
                        ${resultsList}
                      </div>
                    </div>
                  </div>
                `;
            }

            document.getElementById('app-root').innerHTML = headerHtml + '<main class="flex-1 flex flex-col">' + mainHtml + '</main>';
            
            // Re-attach Events
            if (raceState === 'betting') {
                const form = document.getElementById('bet-form');
                if (form) {
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const name = document.getElementById('player-name').value;
                        const horseId = document.getElementById('horse-select').value;
                        const bet = parseFloat(document.getElementById('player-bet').value);
                        if (name && horseId && bet) {
                            players.push({ id: Date.now().toString(), name, horseId, bet });
                            renderApp();
                        }
                    });
                }

                const startBtn = document.getElementById('start-race-btn');
                if (startBtn) {
                    startBtn.addEventListener('click', () => {
                        raceState = 'racing';
                        renderApp();
                        startRaceAnimation();
                    });
                }
            }
        }

        // --- Game Loops ---
        function startRaceAnimation() {
            let active = true;
            // Finish line position calculation
            let targetFinishLine = window.innerWidth < 640 ? 80 : 85; 
            
            function animate() {
                if (!active) return;
                
                let hasWinner = false;
                
                horses.forEach(h => {
                    const jitter = Math.random() * 0.15;
                    h.position += h.baseSpeed + jitter;
                    
                    if (h.position >= targetFinishLine && !hasWinner) {
                        hasWinner = true;
                        winnerId = h.id;
                    }
                    
                    const el = document.getElementById(`horse-anim-${h.id}`);
                    if (el) {
                        el.style.left = `${5 + h.position}%`;
                    }
                });
                
                if (hasWinner) {
                    active = false;
                    setTimeout(() => {
                        raceState = 'finished';
                        renderApp();
                    }, 800);
                } else {
                    animationFrameId = requestAnimationFrame(animate);
                }
            }
            
            animationFrameId = requestAnimationFrame(animate);
        }

        // Global functions accessible from inline HTML handlers
        window.resetRace = function() {
            initHorses();
            players = [];
            raceState = 'betting';
            winnerId = null;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            renderApp();
        };

        // --- Initialization ---
        initHorses();
        renderApp();
    </script>
</body>
</html>
